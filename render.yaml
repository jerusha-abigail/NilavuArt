services:
  - type: web
    name: nilavuart
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/nilavuart.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-4.1-mini
